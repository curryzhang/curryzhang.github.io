    <title>Curry 的博客</title>
    <script>
      // 在应用挂载前先确定主题，避免闪烁
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (!t) {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
